// Inspect actual classfile references in the entire distribution, including third-party code.
// No scanner exceptions or package allowlists: both developer and Hub artifacts use this guard.
ext.auditJarApis = { File artifact ->
    def violations = []
    new java.util.jar.JarFile(artifact).withCloseable { jar ->
        jar.entries().each { entry ->
            if (!entry.name.endsWith('.class')) return
            assert !(entry.name.startsWith('org/jsoup/') || entry.name.startsWith('com/wikipane/vendor/')) :
                "Unexpected bundled dependency in ${artifact.name}"
            jar.getInputStream(entry).withCloseable { stream ->
                def data = new DataInputStream(stream)
                assert data.readInt() == (int) 0xCAFEBABE
                data.readUnsignedShort()
                assert data.readUnsignedShort() <= 55 : "Not Java 11: ${entry.name}"
                def pool = new Object[data.readUnsignedShort()]
                for (int index = 1; index < pool.length; index++) {
                    int tag = data.readUnsignedByte()
                    switch (tag) {
                        case 1: pool[index] = data.readUTF(); break
                        case 3: case 4: data.readInt(); break
                        case 5: case 6: data.readLong(); index++; break
                        case 7: case 8: case 16: case 19: case 20:
                            pool[index] = [tag, data.readUnsignedShort()]; break
                        case 9: case 10: case 11: case 12: case 17: case 18:
                            pool[index] = [tag, data.readUnsignedShort(), data.readUnsignedShort()]; break
                        case 15: data.readUnsignedByte(); data.readUnsignedShort(); break
                        default: throw new GradleException("Unknown classfile constant ${tag}: ${entry.name}")
                    }
                }
                pool.each { constant ->
                    if (!(constant instanceof List)) return
                    int tag = constant[0]
                    if (tag == 7) {
                        String type = pool[constant[1]]
                        if (type.startsWith('java/net/http/') || type.startsWith('java/lang/reflect/'))
                            violations.add("${entry.name}: ${type}")
                    }
                    if (!(tag in [9, 10, 11])) return
                    String owner = pool[pool[constant[1]][1]]
                    String name = pool[pool[constant[2]][1]]
                    boolean prohibited = owner == 'java/net/URL' && name in ['openConnection', 'openStream']
                    prohibited |= owner == 'java/lang/System' && name in [
                        'err', 'out', 'in', 'exit', 'load', 'loadLibrary'
                    ]
                    prohibited |= owner.startsWith('java/net/http/') || owner.startsWith('java/lang/reflect/')
                    prohibited |= owner == 'java/lang/Runtime' && name in ['exec', 'exit', 'load', 'loadLibrary']
                    prohibited |= owner in ['java/lang/ProcessBuilder', 'sun/misc/Unsafe', 'jdk/internal/misc/Unsafe']
                    prohibited |= owner in [
                        'java/io/FileInputStream', 'java/io/FileOutputStream', 'java/nio/file/Files'
                    ]
                    prohibited |= owner == 'java/lang/Class' && name in [
                        'forName', 'newInstance', 'getMethod', 'getDeclaredMethod', 'getField', 'getDeclaredField',
                        'getConstructor', 'getDeclaredConstructor', 'getClassLoader'
                    ]
                    if (prohibited) violations.add("${entry.name}: ${owner}.${name}")
                }
            }
        }
    }
    assert violations.isEmpty() : "Prohibited packaged API references:\n" + violations.unique().join('\n')
}

tasks.register('verifyPackagedApis') {
    dependsOn tasks.named('developerPluginJar')
    doLast { auditJarApis(tasks.developerPluginJar.archiveFile.get().asFile) }
}
tasks.named('check') { dependsOn tasks.named('verifyPackagedApis') }
tasks.matching { it.name == 'runelitePluginHubPackage' }.configureEach {
    doLast { auditJarApis(archiveFile.get().asFile) }
}

// A valid class with an intentionally forbidden, unused constant-pool reference.
// This proves the guard also catches dependency code outside WikiPane's own namespace.
tasks.register('verifyApiAudit') {
    doLast {
        def cases = [
            [9, 'java/lang/System', 'err', 'Ljava/io/PrintStream;'],
            [10, 'java/net/URL', 'openConnection', '()Ljava/net/URLConnection;'],
            [10, 'java/net/http/HttpClient', 'newBuilder', '()Ljava/net/http/HttpClient$Builder;']
        ]
        cases.eachWithIndex { reference, index ->
            def bytes = new ByteArrayOutputStream()
            def data = new DataOutputStream(bytes)
            data.writeInt((int) 0xCAFEBABE); data.writeShort(0); data.writeShort(55); data.writeShort(11)
            data.writeByte(1); data.writeUTF(reference[1])
            data.writeByte(7); data.writeShort(1)
            data.writeByte(1); data.writeUTF(reference[2])
            data.writeByte(1); data.writeUTF(reference[3])
            data.writeByte(12); data.writeShort(3); data.writeShort(4)
            data.writeByte(reference[0]); data.writeShort(2); data.writeShort(5)
            data.writeByte(1); data.writeUTF('dependency/AuditFixture')
            data.writeByte(7); data.writeShort(7)
            data.writeByte(1); data.writeUTF('java/lang/Object')
            data.writeByte(7); data.writeShort(9)
            data.writeShort(0x21); data.writeShort(8); data.writeShort(10)
            4.times { data.writeShort(0) }
            def fixture = layout.buildDirectory.file("api-audit/fixture-${index}.jar").get().asFile
            fixture.parentFile.mkdirs()
            new java.util.jar.JarOutputStream(new FileOutputStream(fixture)).withCloseable { jar ->
                jar.putNextEntry(new java.util.jar.JarEntry('dependency/AuditFixture.class'))
                jar.write(bytes.toByteArray()); jar.closeEntry()
            }
            boolean rejected = false
            try { auditJarApis(fixture) }
            catch (AssertionError error) {
                assert error.message.contains(reference[1] + '.' + reference[2])
                rejected = true
            }
            assert rejected : "Artifact guard missed ${reference[1]}.${reference[2]}"
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyApiAudit') }

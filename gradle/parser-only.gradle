// Compile a private, in-memory jsoup subset from a pinned, verified source artifact.
configurations { jsoupSources }
dependencies { jsoupSources 'org.jsoup:jsoup:1.23.2:sources@jar' }

def parserDirectory = layout.buildDirectory.dir('generated/sources/wikiParser')
def parserOverrides = file('third-party/jsoup-parser/overrides')
def parserPatch = file('third-party/jsoup-parser/parser-only.patch')

tasks.register('prepareParserSource') {
    inputs.files(configurations.jsoupSources, fileTree(parserOverrides), parserPatch)
    outputs.dir(parserDirectory)
    doLast {
        def archive = configurations.jsoupSources.singleFile
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
        assert hash == 'f0ed21735857df93c3e461d1aecf89d28c3eda552f2e043d68959d341376aa17'
        def output = parserDirectory.get().asFile
        delete output
        copy {
            from zipTree(archive)
            into output
            include 'org/jsoup/nodes/**', 'org/jsoup/parser/**', 'org/jsoup/select/**'
            include 'org/jsoup/internal/**', 'org/jsoup/safety/**'
            include 'org/jsoup/SerializationException.java', 'org/jsoup/Progress.java'
            include 'org/jsoup/helper/Validate.java', 'org/jsoup/helper/ValidationException.java'
            exclude '**/package-info.java'
        }
        copy { from parserOverrides; into output }
        // Apply ordinary reviewable unified hunks. Every old line must match exactly.
        def lines = parserPatch.readLines('UTF-8')
        int index = 0
        while (index < lines.size()) {
            assert lines[index].startsWith('--- a/')
            String path = lines[index++].substring(6)
            assert lines[index++].startsWith('+++ b/')
            def target = new File(output, path)
            def original = target.readLines('UTF-8'), result = []
            int cursor = 0
            while (index < lines.size() && lines[index].startsWith('@@')) {
                def header = lines[index++] =~ /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@.*$/
                assert header.matches()
                int start = Integer.parseInt(header[0][1]) - 1
                result.addAll(original.subList(cursor, start))
                cursor = start
                while (index < lines.size() && !lines[index].startsWith('@@') && !lines[index].startsWith('--- a/')) {
                    String line = lines[index++]
                    if (line.startsWith(' ') || line.startsWith('-')) {
                        assert original[cursor++] == line.substring(1) : "Parser patch mismatch in ${path}"
                    }
                    if (line.startsWith(' ') || line.startsWith('+')) result.add(line.substring(1))
                }
            }
            result.addAll(original.subList(cursor, original.size()))
            target.setText(result.join('\n') + '\n', 'UTF-8')
        }
        // Private namespace prevents cross-plugin parser/version collisions.
        fileTree(output) { include '**/*.java' }.files.each { source ->
            String content = source.getText('UTF-8')
                .replaceAll(/(?m)^import org\.jspecify\.annotations\.[^;]+;\s*\n/, '')
                .replaceAll(/@(?:Nullable|NullMarked|NullUnmarked)\b\s*/, '')
                .replace('org.jsoup', 'com.wikipane.vendor.jsoup')
            String relative = output.toPath().relativize(source.toPath()).toString()
            def target = new File(output, relative.replace('org/jsoup/', 'com/wikipane/vendor/jsoup/'))
            target.parentFile.mkdirs()
            target.setText(content, 'UTF-8')
        }
        delete new File(output, 'org')
    }
}
sourceSets.main.java.srcDir(parserDirectory)
tasks.named('compileJava') { dependsOn tasks.named('prepareParserSource') }

tasks.named('processResources') {
    from('third-party/jsoup-LICENSE.txt') { into 'META-INF/licenses' }
    from('third-party/jsoup-parser/README.md') {
        into 'META-INF'
        rename { 'WikiPane-parser-NOTICE.md' }
    }
}
